# ============================================================
# NanoMQ 配置文件 - 边缘网关本地Broker
# 控制信令与视频流分离设计
# ============================================================

# --- 基本配置 ---
system {
    # 线程数(建议等于CPU核心数)
    num_taskq_thread = 4
    max_taskq_thread = 4

    # 并行工作线程
    parallel = 4

    # QoS 1/2 消息重排
    qos_duration = 10s
}

# --- MQTT监听端口 ---
listeners {
    # TCP端口 - 控制信令
    tcp {
        bind = "0.0.0.0:1883"
    }

    # WebSocket端口 - 视频流通道(分离)
    ws {
        bind = "0.0.0.0:8083"
    }

    # SSL/TLS端口(生产环境启用)
    # ssl {
    #     bind = "0.0.0.0:8883"
    #     keyfile = "/etc/nanomq/certs/server.key"
    #     certfile = "/etc/nanomq/certs/server.crt"
    #     cacertfile = "/etc/nanomq/certs/ca.crt"
    # }
}

# --- 日志配置 ---
log {
    to = [file, console]
    level = warn
    dir = "/var/log/nanomq"
    file = "nanomq.log"
    rotation {
        size = 10MB
        count = 5
    }
}

# --- ACL访问控制 ---
auth {
    # 允许匿名访问(开发环境)
    allow_anonymous = true

    # 密码认证(生产环境)
    # password = {
    #     allow_anonymous = false
    #     
    # }
}

# --- 桥接配置: 边缘网关 -> 云端 ---
bridges {
    mqtt {
        # 云端Broker连接
        nodes = [
            {
                name = cloud_bridge
                connector {
                    server = "${CLOUD_MQTT_HOST}:8883"
                    proto_ver = 4
                    username = "${CLOUD_MQTT_USER}"
                    password = "${CLOUD_MQTT_PASS}"
                    ssl {
                        enable = true
                        key_password = ""
                        keyfile = ""
                        certfile = ""
                        cacertfile = ""
                    }
                }

                # 桥接方向: 本地 -> 云端 (上行)
                forwards = [
                    {
                        remote_topic = "thing/product/${GATEWAY_SN}/#"
                        local_topic = "thing/product/${GATEWAY_SN}/#"
                    }
                ]

                # 桥接方向: 云端 -> 本地 (下行)
                subscription = [
                    {
                        remote_topic = "thing/product/${GATEWAY_SN}/services"
                        local_topic = "thing/product/${GATEWAY_SN}/services"
                        qos = 1
                    },
                    {
                        remote_topic = "thing/product/${GATEWAY_SN}/property/set"
                        local_topic = "thing/product/${GATEWAY_SN}/property/set"
                        qos = 1
                    },
                    {
                        remote_topic = "thing/product/${GATEWAY_SN}/drc/down"
                        local_topic = "thing/product/${GATEWAY_SN}/drc/down"
                        qos = 1
                    }
                ]

                parallel = 2
                keepalive = 60
                clean_start = false
            }
        ]
    }
}

# --- WebHook配置 ---
webhook {
    # 启用WebHook将MQTT消息转发到本地HTTP服务
    enable = true
    url = "http://127.0.0.1:5000/webhook/mqtt"
    headers {
        Content-Type = "application/json"
    }
    body {
        # 转发所有Topic的消息到HTTP端点
        encoding = json
    }
}

# --- 数据持久化 ---
sqlite {
    # 启用消息持久化(断网缓存)
    enable = false
    disk_cache_size = 102400
    mounted_file_path = "/data/nanomq/cache.db"
    flush_mem_threshold = 100
    resend_interval = 5000
}
