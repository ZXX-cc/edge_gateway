# ============================================================
# 边缘网关配置 - 树莓派/Windows + MQTT三模式 + MAVLink
# ============================================================

# --- 网关身份 ---
gateway:
  sn: "BXD020120260727" # 网关序列号；DJI Demo topic 匹配要求纯字母数字
  name: "BXD020120260727" # 网关名称
  product_type: "edge-gateway" # 产品类型

# --- 运行模式 ---
runtime:
  mode: "test" # test/production；production 禁止测试 SN 和缺失真实链路拓扑元数据

# --- 运行时数据库（Ubuntu 本机 MongoDB） ---
database:
  backend: "mongodb"
  mongodb:
    host: "127.0.0.1"
    port: 27017
    database: "edge_gateway"
    username: "admin"
    password: "admin123"
    auth_source: "admin"
    connect_timeout_ms: 5000

# --- MQTT 主连接模式 ---
mqtt:
  # MQTT 连接模式：
  # - nano：网关直连本机或指定的本地 Broker，适合纯本地联调。
  # - cloud：网关绕过本机 Broker，直接连接平台/云端 Broker，链路最短但受广域网稳定性影响。
  # - bridge：生产推荐。网关只连接本机 Broker，本机 Broker 再桥接平台/云端；
  #   云端断链时网关和本地业务仍可继续发布/订阅本机消息，Broker 负责断线重连和缓存转发。
  mode: "bridge"
  topic_prefix: "thing/product" # 控制信令 Topic 前缀，Dock3 默认 thing/product
  background_handler_workers: 4 # 文件/日志/媒体等本地 IO handler 后台线程数
  dedup_ttl_seconds: 300 # 下行请求去重缓存保留秒数
  dedup_max_entries: 1024 # 下行请求去重缓存最大条数

  nano:
    # nano 模式：网关直连本机或指定 Broker；不经过云端桥接。
    host: "127.0.0.1"
    port: 1883
    client_id: "edge_gateway_BXD020120260727_nano"
    keepalive: 60
    username: ""
    password: ""

  cloud:
    # cloud 模式：网关直接连接平台/云端 Broker；生产中只有确认网络稳定时使用。
    host: "tcp://39.185.72.155"
    port: 11883
    client_id: "edge_gateway_BXD020120260727_cloud"
    keepalive: 60
    username: "admin"
    password: "sys@mqtt.2022"
    ssl:
      enabled: false # 当前主程序尚未启用 TLS；需要 8883 时必须先接入 tls_set
      cert_file: ""
      key_file: ""
      ca_file: ""

  bridge:
    local:
      # bridge 模式下网关实际连接这个本机 Broker。
      # 本机 Broker 可以是 NanoMQ、Mosquitto 或 EMQX；云端桥接由 Broker 配置负责。
      host: "127.0.0.1"
      port: 1883
      client_id: "edge_gateway_BXD020120260727_bridge"
      keepalive: 60
      username: ""
      password: ""
    remote:
      # 本段仅作为生成/核对 Broker bridge 配置的云端参数，网关进程不会直接连接这里。
      host: "tcp://39.185.72.155"
      port: 11883
      username: "admin"
      password: "sys@mqtt.2022"
      client_id: "edge_gateway_BXD020120260727_bridge_remote"
      clean_start: false # 建议桥接保持持久会话，减少云端断链期间的消息丢失
      qos: 1 # 建议桥接业务 Topic 使用 QoS1，兼顾可靠性和实时性
      bridge_topics:
        - "thing/product/BXD020120260727/#"
        - "sys/product/BXD020120260727/#"
        - "thing/product/CG022620260528/#"
        - "sys/product/CG022620260528/#"

# --- NanoMQ 本地Broker兼容配置 ---
# 旧代码和部分脚本仍会读取 nanomq.*；新主网关优先读取上方 mqtt.mode 配置。
nanomq:
  enabled: true
  type: "tcp"
  host: "127.0.0.1"
  port: 1883
  client_id: "edge_gateway_BXD020120260727_legacy"
  ws_port: 8083 # WebSocket端口(视频流分离)
  max_clients: 100
  keepalive: 60
  username: ""
  password: ""

  # 控制信令Topic前缀
  topic_prefix: "thing/product"
  background_handler_workers: 4 # 文件列表/上传等本地 IO 后台执行，避免 file_list_get 被长任务排队超时。

  # SSL/TLS配置(生产环境启用)
  ssl:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

# --- 云端MQTT兼容配置 ---
# 旧工具和直连云端模式可读取 cloud.*；bridge 生产模式下由本机 Broker 使用这些信息做桥接。
cloud:
  enabled: false # 默认关闭，配置后启用
  broker_host: "tcp://39.185.72.155"
  broker_port: 11883
  username: "admin"
  password: "sys@mqtt.2022"
  client_id: ""

  # SSL配置
  ssl: true
  cert_file: ""
  key_file: ""

  # 心跳配置
  keepalive: 60
  reconnect_interval: 5

# --- MAVLink配置 ---
mavlink:
  enabled: true # 网关直连飞控/SITL；机巢链路由 nest_mavlink 单独连接
  connection:
    # 实机按物理拓扑使用 TTL 串口：type: "serial"、port: "/dev/ttyS0"、baudrate: 921600。
    # 当前 test 模式保留 UDP，用于 ArduPilot SITL 回归。
    type: "tcp"
    host: "192.168.1.182"
    port: 8600 # SITL/飞控 -> 网关主 MAVLink

  # 系统ID
  system_id: 255
  component_id: 191 # MAV_COMP_ID_ONBOARD_COMPUTER；避免和 Mission Planner/QGC 的 255/190 撞源。
  target_system_id: 1 # 飞控目标 sysid；按 HEARTBEAT/日志里的真实飞机 sysid 修改。
  target_component_id: 1 # 飞控目标 compid；ArduPilot 飞控通常是 1。
  aircraft_system_id: 1 # 飞机飞控 sysid；TelemetryModule 只用该 sysid 构建无人机 OSD，避免机巢 101 空遥测覆盖。
  aircraft_component_id: 1 # 飞机飞控 compid；TelemetryModule 只用该组件 HEARTBEAT 更新飞控模式/解锁状态，避免相机/云台心跳覆盖。

  # 遥测推送频率(Hz)
  telemetry_rate:
    osd: 0.5 # OSD 定频上报给平台：0.5Hz = 2 秒一次；不要用机巢空控制命令代替上报。
    state: 0 # 状态变更(事件触发)
    gps: 10
    attitude: 10
    battery: 1

# --- 机巢MAVLink配置（独立机巢链路） ---
nest_mavlink:
  enabled: true # 网关通过 14551 与机巢/机巢模拟器交换自定义机巢 MAVLink
  protocol_version: "v1.7" # 真实机巢按客户《机巢协议v1.7》解析；旧模拟器需单独覆盖为 "v1.3"。
  # UDP 需要空指令注册对端地址；TCP 长连接默认不发空轮询，避免对端按非法命令断开。
  status_poll_enabled: false
  status_poll_interval: 2.0
  reconnect_enabled: true # TCP 被机巢端关闭后自动重连，不需要重启网关。
  reconnect_interval: 2.0
  connection:
    type: "tcp"
    host: "192.168.1.11"
    port: 8600 # 网关 <-> 机巢/机巢模拟器；不承载飞控标准 MAVLink
  sitl:
    host: "127.0.0.1"
    port: 14552 # 旧串联代理兼容端口；默认脚本不再使用
  system_id: 255
  component_id: 1

# --- 设备属性配置 ---
device:
  firmware_version: "1.0.0" # 固件版本
  storage_capacity: 64000 # 存储容量(MB)
  nest_command_ack_timeout: 5.0 # services_reply 同步等待机巢 12005 指令 ACK/拒绝的超时时间(s)
  nest_command_state_timeout: 60.0 # services_reply 同步等待机巢 12004 最终状态到位的超时时间(s)
  drone_power_state_timeout: 120.0 # 飞机上下电后等待机巢飞机心跳/主飞控 MAVLink 连接到位的超时时间(s)
  nest_command_require_final_state: true # true 时机巢动作类命令必须等 12004 最终状态到位才回复 ok
  allow_local_state_reset: false # true 时允许 device_reset 只重置网关本地状态；实机默认 false，避免伪造硬件复位成功
  auto_bind_on_startup: true # 本地联调默认置为已绑定，跳过平台 organization 绑定流程
  auto_bind_workspace_id: "local_test_workspace"
  auto_bind_workspace_name: "本地测试工作空间"

  # DOCK3 正式组织绑定。启用后，启动时先发 airport_bind_status，
  # 只有平台明确返回未绑定时，才继续 airport_organization_get/bind。
  organization_binding:
    enabled: false # 本地联调跳过正式 organization requests 绑定链路
    device_binding_code: "SIM-BIND-CODE" # 填平台分配的真实设备绑定码；禁止使用 SIM/TEST 值
    organization_id: "flysee"
    device_callsign: "DJI Dock"
    device_model_key: "3-119-0"
    bind_sub_devices: true

  # 真实链路拓扑元数据。production 模式必须通过配置或启动参数提供，
  # 网关不会自动生成 device_secret/nonce。
  # 这些字段会用于 update_topo 上报到云端：
  # - domain：网关设备的命名空间，Dock/Dock3 机场通常为 "3"
  # - type：BX160 机巢产品类型：
  #   119=01/20倍单光，120=02/20倍三光，121=03/五射，122=04/多光谱，123=05/其他
  # - sub_type：网关设备的产品子类型，当前 BX160 默认为 0
  # - device_secret：网关设备密钥，由云端/设备绑定侧提供
  # - nonce：网关拓扑上报 nonce，由云端/设备绑定侧提供
  # - thing_version：网关设备物模型版本
  topology:
    domain: "3"
    type: 119
    sub_type: 0
    device_secret: "egw_7f9c2a8d4b6e41c0a93f5d82e1b7c6a4"
    nonce: "n_20260727_8b3f6d91a0e24c5f"
    thing_version: "1.1.2"

  # 子设备拓扑列表，会作为 update_topo 的 sub_devices[] 上报。
  # production 模式建议显式配置真实子设备 SN、密钥、nonce 和物模型版本。
  sub_devices:
    - sn: "CG022620260528" # 无人机子设备序列号
      domain: "0" # 子设备命名空间，飞行器通常为 "0"
      type: 60 # 子设备产品类型，需与 DJI 产品支持列表一致
      sub_type: 0 # 子设备产品子类型
      index: "A" # 连接网关设备的通道索引
      device_secret: "" # 子设备密钥
      nonce: "" # 子设备 nonce
      thing_version: "1.1.2" # 子设备物模型版本
      online: false # 默认不连接无人机；收到机巢侧无人机心跳后再置为在线
      paired: true # 是否标记为已配对子设备

  # 飞行限制
  limits:
    max_height: 500 # 最大飞行高度(m)
    max_distance: 50000 # 最大飞行距离(m)
    max_speed: 15 # 最大速度(m/s)
    return_home_power: 30 # 返航预留电量(%)

  # 安全设置
  safety:
    geofence_enabled: true
    obstacle_avoidance: true
    airsense_enabled: false

  drc:
    guided_loiter_radius: 80.0 # Guided 一键起飞/指点飞行盘旋半径兜底值；优先读飞控 WP_LOITER_RAD

# --- 航线任务真实闭环配置 ---
mission:
  wayline:
    # KMZ 航线由网关严格解析成 .waypoints 等价任务点后上传飞控/机巢。
    download_cache_dir: "./data/waylines" # 平台下发 http/https KMZ 时，网关下载后的本地缓存目录
    download_timeout_seconds: 20.0 # 下载平台航线文件的超时时间
    max_download_bytes: 52428800 # 单个航线文件最大下载大小，默认 50 MiB
    # 下面固定机巢起飞点用于网关插入 HOME 和 VTOL_TAKEOFF 点，必须与实际机巢经纬度一致。
    nest_takeoff_point:
      latitude: 43.9759961 # 飞机 HOME/机巢起飞点纬度，用于 KMZ 转换插入 HOME、VTOL_TAKEOFF
      longitude: 125.3979932 # 飞机 HOME/机巢起飞点经度，用于 KMZ 转换插入 HOME、VTOL_TAKEOFF
      altitude: 0.0 # HOME 点相对高度，默认 0 米
      absolute_altitude: 194.92 # 飞机 HOME 点 GPS 海拔高，用于平台/摘要上报，不写入 frame=3 相对高度航点
      takeoff_alt_offset: 40.0 # VTOL_TAKEOFF 高度 = 第一个 executeHeight - 该偏移，最低不小于 0 米
  completion:
    enabled: true # 航线末航点到达后执行真实返航闭环
    auto_return_home: true # 调用真实飞控 RTL/QRTL，不生成模拟完成
    auto_land: false # 固定翼真机默认不主动切 QLAND/LAND
    nest_recovery: true # 非固定翼且已确认降落后才夹紧、关盖、恢复充电
    retry_count: 3 # 飞控/机巢命令失败后的最大尝试次数
    retry_interval_seconds: 2.0 # 两次尝试之间的等待时间

# --- 媒体配置 ---
media:
  storage_path: "./data/media" # 本地存储路径
  auto_upload: true
  upload_quality: "original" # original/high/medium/low
  video_sources: # 真实直播视频源配置；生产环境必须使用 /dev/video*、rtsp://、rtp://、udp://、http:// 或 https://
    normal: "rtsp://192.168.1.119:554/main"
    wide: "rtsp://admin:Cgbxuav301@192.168.1.64:554/main"
    zoom: "rtsp://192.168.1.119:554/main"
    ir: "/dev/video1"
    gimbal: "rtsp://192.168.1.119:554/main"
    mapping_camera: "rtsp://192.168.5.74:8554/LIVE"
    spectral_camera: "rtp://0.0.0.0:23008"
    dock_inside: "rtsp://admin:Cgbxuav301@192.168.1.64:554/main"
    dock_outside: "rtsp://admin:Cgbxuav301@192.168.1.65:554/main"
  remote_media:
    enabled: true
    base_url: "http://192.168.1.119:8554/download/"
    max_depth: 4
    timeout_seconds: 5
    extensions: ["jpg", "jpeg", "png", "dng", "mp4", "mov", "avi", "mkv"]

  # OSS配置(上传凭证由云端下发)
  oss:
    provider: "minio" # minio/aliyun/aws
    endpoint: ""
    bucket: ""
    region: ""
    object_key_prefix: ""
    credentials:
      access_key_id: ""
      access_key_secret: ""
      expire: 0
      security_token: ""

# --- 直播配置 ---
livestream:
  protocols: ["rtmp"] # 当前内置 ffmpeg 真实推流仅支持 RTMP/RTMPS；WebRTC(url_type=4)、GB28181(url_type=3)、Agora(url_type=0) 需要专用直播适配器，mock:// 仍可用于协议专项测试
  default_video_type: "gimbal" # 默认直播镜头/视频源 key，对应 media.video_sources.gimbal
  default_quality: "1080p" # 默认展示质量；实际 Dock3 指令仍以 video_quality 枚举 0..4 为准
  default_bitrate: 4000 # 默认码率，单位 kbps
  default_framerate: 30
  adapters:
    webrtc:
      enabled: false # WebRTC(url_type=4) 需要 WHIP/WebRTC 专用推流适配器；未实现前保持 false
    gb28181:
      enabled: false # GB28181(url_type=3) 需要国标信令和媒体适配器；未实现前保持 false
    agora:
      enabled: false # Agora(url_type=0) 需要声网 SDK/服务适配器；未实现前保持 false

# --- 日志配置 ---
logging:
  level: "INFO" # DEBUG/INFO/WARNING/ERROR
  dir: "./logs" # 日志根目录；总日志会自动按 YYYY-MM 创建月份目录
  filename_prefix: "edge_gateway" # 网关总日志：logs/YYYY-MM/edge_gateway_YYYY-MM-DD.log
  max_file_mb: 100 # 单个日志文件超过该大小会自动切分为 _001/_002，Windows/Ubuntu 通用
  flight_telemetry_interval_seconds: 5 # 飞控遥测字段解释日志间隔；模式/解锁变化会立即输出
  console: true # 同时输出到终端
  capture_print: true # 捕获旧模块 print/stdout/stderr 到日志文件
  daily_files: true # 每日独立日志文件
  monthly_dirs: true # 每月独立日志目录
  important:
    enabled: true # WARNING/ERROR/CRITICAL 会额外写入重要日志，默认保留 30 天
    dir: "important" # 重要日志目录：logs/important/YYYY-MM/important_YYYY-MM-DD.log
    filename_prefix: "important"
    level: "WARNING"
  retention:
    enabled: true # 是否启用运行日志自动清理和压缩
    normal_days: 7 # 普通运行日志保留 7 天
    important_days: 30 # 报错/告警等重要日志保留 30 天
    debug_days: 3 # 调试/原始链路日志保留 3 天
    compress_after_days: 1 # 超过 1 天的旧日志自动 gzip 压缩节省空间
    max_file_mb: 100 # 分类日志未单独配置时沿用该切分大小
    disk_cleanup_enabled: true # 磁盘高水位时允许提前清理日志
    disk_high_watermark_percent: 80 # 磁盘使用率达到 80% 触发兜底清理
    disk_target_percent: 75 # 兜底清理目标水位，优先删调试旧日志，再删普通旧日志，最后才处理重要日志
    debug_categories: ["mqtt_trace", "gateway_traffic", "nest_raw", "drone_report", "mavlink_raw"]
    important_categories: ["alarm", "important"]
  # 专用日志均按 logs/<分类>/YYYY-MM/<分类>_YYYY-MM-DD.log 保存；
  # 加上上面的网关总日志形成分节点输出。dir 可填绝对路径，或相对 logging.dir 的子目录。
  categories:
    gateway:
      enabled: true
      dir: "gateway"
      filename_prefix: "gateway"
    mqtt:
      enabled: true
      dir: "mqtt"
      filename_prefix: "mqtt"
    mqtt_trace:
      enabled: true
      dir: "mqtt_trace"
      filename_prefix: "mqtt_trace"
    gateway_traffic:
      enabled: true
      dir: "gateway_traffic"
      filename_prefix: "gateway_traffic"
    nest_raw:
      enabled: true
      dir: "nest_raw"
      filename_prefix: "nest_raw"
    drone_report:
      enabled: true
      dir: "drone_report"
      filename_prefix: "drone_report"
    mavlink_raw:
      enabled: true
      dir: "mavlink_raw"
      filename_prefix: "mavlink_raw"
    mission:
      enabled: true
      dir: "mission"
      filename_prefix: "mission"
    alarm:
      enabled: true
      dir: "alarm"
      filename_prefix: "alarm"
    nest_plc:
      enabled: true
      dir: "nest_plc"
      filename_prefix: "nest_plc"
    flight_control:
      enabled: true
      dir: "flight_control"
      filename_prefix: "flight_control"
    payload:
      enabled: true
      dir: "payload"
      filename_prefix: "payload"

# --- 请求追踪配置 ---
request_trace:
  enabled: true # 记录 MQTT 请求/回包/handler 追踪，P0 验收需要
  dir: "./logs/request_trace" # JSONL 输出目录；会自动按 YYYY-MM 创建月份目录
  filename_prefix: "request_trace" # 每日文件名：request_trace_YYYY-MM-DD.jsonl
  max_memory: 5000 # 内存 ring buffer 条数
  max_queue: 10000 # 后台写入队列长度，避免 MQTT 热路径阻塞
  payload_max_chars: 3000 # 单条 payload 最大保留字符数，超长会截断

# --- 负载控制链路 ---
payload:
  # 负载均与网关直连。主 MAVLink/TTL 只承载飞控指令，机巢和飞控
  # 不中转负载控制、视频流或原始数据。
  control_path: "direct_gateway"
  flight_controller_fallback_enabled: false
  frame_zoom_centering_enabled: true
  frame_zoom_centering_mode: "track"
  frame_zoom_centering_fallback_mode: "zoom_only"
  frame_zoom_allow_zoom_without_center: true
  frame_zoom_track_settle_seconds: 0.25
  frame_zoom_centering_duration: 0.08
  frame_zoom_centering_speed_scale: 1200
  frame_zoom_centering_max_speed: 400
  frame_zoom_max_ratio: 30.0
  devices:
    gimbal:
      name: "吊舱"
      enabled: true
      auto_connect: true # 启动时后台预连接 ViewLink，避免首个云台控制命令只触发连接
      direct_to_gateway: true
