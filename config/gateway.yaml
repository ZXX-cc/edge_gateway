# ============================================================
# 边缘网关配置 - 树莓派 + NanoMQ + MAVLink
# ============================================================

# --- 网关身份 ---
gateway:
  sn: "BXD020120260727" # 网关序列号；DJI Demo topic 匹配要求纯字母数字
  name: "BXD020120260727" # 网关名称
  product_type: "edge-gateway" # 产品类型

# --- 运行模式 ---
runtime:
  mode: "test" # test/production；production 禁止测试 SN 和缺失真实链路拓扑元数据

# --- 运行时数据库（Ubuntu 本机 MongoDB） ---
database:
  backend: "mongodb"
  mongodb:
    host: "127.0.0.1"
    port: 27017
    database: "edge_gateway"
    username: "admin"
    password: "admin123"
    auth_source: "admin"
    connect_timeout_ms: 5000

# --- NanoMQ 本地Broker配置 ---
nanomq:
  enabled: true
  type: "tcp"
  host: "39.185.72.155"
  port: 11883
  ws_port: 8083 # WebSocket端口(视频流分离)
  max_clients: 100
  keepalive: 60
  username: "admin"
  password: "sys@mqtt.2022"

  # 控制信令Topic前缀
  topic_prefix: "thing/product"
  background_handler_workers: 4 # 文件列表/上传等本地 IO 后台执行，避免 file_list_get 被长任务排队超时。

  # SSL/TLS配置(生产环境启用)
  ssl:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

# --- 云端MQTT配置 ---
cloud:
  enabled: false # 默认关闭，配置后启用
  broker_host: "tcp://39.185.72.155"
  broker_port: 11883
  username: "admin"
  password: "sys@mqtt.2022"
  client_id: ""

  # SSL配置
  ssl: true
  cert_file: ""
  key_file: ""

  # 心跳配置
  keepalive: 60
  reconnect_interval: 5

# --- MAVLink配置 ---
mavlink:
  enabled: true # 网关直连飞控/SITL；机巢链路由 nest_mavlink 单独连接
  connection:
    # 实机按物理拓扑使用 TTL 串口：type: "serial"、port: "/dev/ttyS0"、baudrate: 921600。
    # 当前 test 模式保留 UDP，用于 ArduPilot SITL 回归。
    type: "tcp"
    host: "192.168.1.182"
    port: 8600 # SITL/飞控 -> 网关主 MAVLink

  # 系统ID
  system_id: 255
  component_id: 190 # MAV_COMP_ID_MISSIONPLANNER

  # 遥测推送频率(Hz)
  telemetry_rate:
    osd: 0.5 # OSD 定频上报给平台：0.5Hz = 2 秒一次；不要用机巢空控制命令代替上报。
    state: 0 # 状态变更(事件触发)
    gps: 10
    attitude: 10
    battery: 1

# --- 机巢MAVLink配置（独立机巢链路） ---
nest_mavlink:
  enabled: true # 网关通过 14551 与机巢/机巢模拟器交换自定义机巢 MAVLink
  # UDP 需要空指令注册对端地址；TCP 长连接默认不发空轮询，避免对端按非法命令断开。
  status_poll_enabled: false
  status_poll_interval: 2.0
  reconnect_enabled: true # TCP 被机巢端关闭后自动重连，不需要重启网关。
  reconnect_interval: 2.0
  connection:
    type: "tcp"
    host: "192.168.1.11"
    port: 8600 # 网关 <-> 机巢/机巢模拟器；不承载飞控标准 MAVLink
  sitl:
    host: "127.0.0.1"
    port: 14552 # 旧串联代理兼容端口；默认脚本不再使用
  system_id: 255
  component_id: 1

# --- 设备属性配置 ---
device:
  firmware_version: "1.0.0" # 固件版本
  storage_capacity: 64000 # 存储容量(MB)
  auto_bind_on_startup: true # test 模式下自动绑定，便于直接运行云台/负载验收
  auto_bind_workspace_id: "local_test_workspace"
  auto_bind_workspace_name: "本地测试工作空间"

  # 真实链路拓扑元数据。production 模式必须通过配置或启动参数提供，
  # 网关不会自动生成 device_secret/nonce。
  # 这些字段会用于 update_topo 上报到云端：
  # - domain：网关设备的命名空间，Dock/Dock3 机场通常为 "3"
  # - type：网关设备的产品类型，需与 DJI 上云 API 产品支持列表一致
  # - model_code：BX160 机巢配置代号；会映射为 sub_type：
  #   01=20倍单光->0，02=20倍三光->1，03=五射->2，04=多光谱->3，05=其他->4
  # - sub_type：网关设备的产品子类型；未配置 model_code 时直接使用该值
  # - device_secret：网关设备密钥，由云端/设备绑定侧提供
  # - nonce：网关拓扑上报 nonce，由云端/设备绑定侧提供
  # - thing_version：网关设备物模型版本
  topology:
    domain: "3"
    type: 119
    model_code: "01"
    sub_type: 0
    device_secret: "egw_7f9c2a8d4b6e41c0a93f5d82e1b7c6a4"
    nonce: "n_20260727_8b3f6d91a0e24c5f"
    thing_version: "1.1.2"

  # 子设备拓扑列表，会作为 update_topo 的 sub_devices[] 上报。
  # production 模式建议显式配置真实子设备 SN、密钥、nonce 和物模型版本。
  # 示例：
  # sub_devices:
  #   - sn: "DRONESIM001"        # 子设备序列号
  #     domain: "0"              # 子设备命名空间，飞行器通常为 "0"
  #     type: 60                 # 子设备产品类型，需与 DJI 产品支持列表一致
  #     sub_type: 0              # 子设备产品子类型
  #     index: "A"               # 连接网关设备的通道索引
  #     device_secret: ""        # 子设备密钥
  #     nonce: ""                # 子设备 nonce
  #     thing_version: "1.1.2"   # 子设备物模型版本
  #     online: true             # 是否启动时作为在线子设备上报
  #     paired: true             # 是否标记为已配对子设备

  # 飞行限制
  limits:
    max_height: 120 # 最大飞行高度(m)
    max_distance: 10000 # 最大飞行距离(m)
    max_speed: 15 # 最大速度(m/s)
    return_home_power: 30 # 返航预留电量(%)

  # 安全设置
  safety:
    geofence_enabled: true
    obstacle_avoidance: true
    airsense_enabled: false

# --- 航线任务真实闭环配置 ---
mission:
  completion:
    enabled: true # 航线末航点到达后执行返航、降落、收舱、充电闭环
    auto_return_home: true # 调用真实飞控 RTL/QRTL，不生成模拟完成
    auto_land: true # 返航指令下发后继续调用真实降落指令
    nest_recovery: true # 降落后夹紧、关盖、恢复充电
    retry_count: 3 # 飞控/机巢命令失败后的最大尝试次数
    retry_interval_seconds: 2.0 # 两次尝试之间的等待时间

# --- 媒体配置 ---
media:
  storage_path: "./data/media" # 本地存储路径
  auto_upload: true
  upload_quality: "original" # original/high/medium/low
  video_sources: # 真实直播视频源配置；生产环境必须使用 /dev/video*、rtsp://、http:// 或 https://
    normal: "rtsp://192.168.1.119:554/main"
    wide: "rtsp://admin:Cgbxuav301@192.168.1.64:554/main"
    zoom: "rtsp://192.168.1.119:554/main"
    ir: "/dev/video1"
    gimbal: "rtsp://192.168.1.119:554/main"
    mapping_camera: "rtsp://192.168.5.74:8554/LIVE"
    dock_inside: "rtsp://admin:Cgbxuav301@192.168.1.64:554/main"
    dock_outside: "rtsp://admin:Cgbxuav301@192.168.1.65:554/main"
  remote_media:
    enabled: true
    base_url: "http://192.168.1.119:8554/download/"
    max_depth: 4
    timeout_seconds: 5
    extensions: ["jpg", "jpeg", "png", "dng", "mp4", "mov", "avi", "mkv"]

  # OSS配置(上传凭证由云端下发)
  oss:
    provider: "minio" # minio/aliyun/aws
    endpoint: ""
    bucket: ""
    region: ""
    object_key_prefix: ""
    credentials:
      access_key_id: ""
      access_key_secret: ""
      expire: 0
      security_token: ""

# --- 直播配置 ---
livestream:
  protocols: ["webrtc", "rtmp"]
  default_video_type: "gimbal"
  default_quality: "1080p"
  default_bitrate: 4000 # kbps
  default_framerate: 30

# --- 日志配置 ---
logging:
  level: "INFO" # DEBUG/INFO/WARNING/ERROR
  dir: "./logs" # 日志根目录；总日志会自动按 YYYY-MM 创建月份目录
  filename_prefix: "edge_gateway" # 网关总日志：logs/YYYY-MM/edge_gateway_YYYY-MM-DD.log
  flight_telemetry_interval_seconds: 5 # 飞控遥测字段解释日志间隔；模式/解锁变化会立即输出
  console: true # 同时输出到终端
  capture_print: true # 捕获旧模块 print/stdout/stderr 到日志文件
  daily_files: true # 每日独立日志文件
  monthly_dirs: true # 每月独立日志目录
  # 专用日志均按 logs/<分类>/YYYY-MM/<分类>_YYYY-MM-DD.log 保存；
  # 加上上面的网关总日志形成分节点输出。dir 可填绝对路径，或相对 logging.dir 的子目录。
  categories:
    gateway:
      enabled: true
      dir: "gateway"
      filename_prefix: "gateway"
    mqtt:
      enabled: true
      dir: "mqtt"
      filename_prefix: "mqtt"
    mavlink_raw:
      enabled: true
      dir: "mavlink_raw"
      filename_prefix: "mavlink_raw"
    mission:
      enabled: true
      dir: "mission"
      filename_prefix: "mission"
    alarm:
      enabled: true
      dir: "alarm"
      filename_prefix: "alarm"
    nest_plc:
      enabled: true
      dir: "nest_plc"
      filename_prefix: "nest_plc"
    flight_control:
      enabled: true
      dir: "flight_control"
      filename_prefix: "flight_control"
    payload:
      enabled: true
      dir: "payload"
      filename_prefix: "payload"

# --- 请求追踪配置 ---
request_trace:
  enabled: true # 记录 MQTT 请求/回包/handler 追踪，P0 验收需要
  dir: "./logs/request_trace" # JSONL 输出目录；会自动按 YYYY-MM 创建月份目录
  filename_prefix: "request_trace" # 每日文件名：request_trace_YYYY-MM-DD.jsonl
  max_memory: 5000 # 内存 ring buffer 条数
  max_queue: 10000 # 后台写入队列长度，避免 MQTT 热路径阻塞
  payload_max_chars: 3000 # 单条 payload 最大保留字符数，超长会截断

# --- 负载控制链路 ---
payload:
  # 负载均与网关直连。主 MAVLink/TTL 只承载飞控指令，机巢和飞控
  # 不中转负载控制、视频流或原始数据。
  control_path: "direct_gateway"
  flight_controller_fallback_enabled: false
  devices:
    gimbal:
      name: "吊舱"
      enabled: true
      auto_connect: true
      direct_to_gateway: true
      cloud_api:
        type: 52
        subtype: 0
        gimbal_index: 0
        video_index: "normal-0"
        video_type: "normal"
        switchable_video_types: ["normal", "wide", "zoom", "infrared"]
      channels:
        control:
          direction: "bidirectional"
          transport: "viewlink_tcp"
          adapter: "viewlink"
          host: "192.168.1.119"
          port: 2000
          connect_timeout: 5
          sdk_dir: "D:/ViewLink/bin/win64" # ViewLink SDK 目录；留空时使用 adapter 默认值
        video:
          direction: "payload_to_gateway"
          transport: "rtsp"
          endpoint: "rtsp://192.168.1.119:554/main" # 吊舱视频流地址
          timing: "realtime"
    mapping_camera:
      name: "正射/倾斜相机"
      enabled: true
      direct_to_gateway: true
      cloud_api:
        type: 52
        subtype: 0
        gimbal_index: 1
        video_index: "mapping-0"
        video_type: "normal"
        source_key: "mapping_camera"
        switchable_video_types: ["normal"]
      channels:
        control:
          direction: "conditional"
          transport: "ttl_via_flight_controller_when_armed_gateway_direct_when_disarmed"
          protocol: "rainpoo_v3"
          flight_controller_state_key: "armed"
          gateway_host: "192.168.5.74"
          serial:
            port: ""
            baudrate: 115200
            level: "ttl_3v3"
            photo_command_hex: "FA FA 00 01 00 00 01 A1 03 01 AC 11 AF AF"
            photo_success_reply_hex: "FB FB 00 01 00 00 01 A1 03 00 BC 30 BF BF"
          trigger:
            mode: "low_level"
            hold_ms: 50
          feedback:
            mode: "low_level"
            hold_ms: 5
          timing: "on_demand"
        video:
          direction: "payload_to_gateway"
          transport: "rtsp"
          endpoint: "rtsp://192.168.5.74:8554/LIVE"
          timing: "realtime"
        post_landing_raw_data:
          direction: "payload_to_gateway"
          transport: "ftp"
          endpoint: "ftp://192.168.5.74/DCIM"
          smb_endpoint: "\\\\192.168.5.74\\DCIM"
          file_pattern: "*/Riebo*.jpg"
          timeout_seconds: 30
          download_jobs: 4
          timing: "post_landing"
    lidar:
      name: "激光雷达"
      enabled: true
      direct_to_gateway: true
      channels:
        post_landing_raw_data:
          direction: "payload_to_gateway"
          transport: "vendor_file_transfer"
          endpoint: ""
          timing: "post_landing"
    spectral_camera:
      name: "多光谱/高光谱"
      enabled: true
      direct_to_gateway: true
      channels:
        video:
          direction: "payload_to_gateway"
          transport: "vendor_stream"
          endpoint: ""
          timing: "realtime"
        post_landing_raw_data:
          direction: "payload_to_gateway"
          transport: "vendor_file_transfer"
          endpoint: ""
          timing: "post_landing"
    speaker:
      name: "喊话器"
      enabled: true
      direct_to_gateway: true
      channels:
        control_audio:
          direction: "gateway_to_payload"
          transport: "vendor_protocol"
          endpoint: ""
          timing: "on_demand"

# --- RTK/NTRIP配置 ---
rtk:
  enabled: false # 是否启用RTK差分定位
  host: "" # NTRIP服务器地址
  port: 8002 # NTRIP服务器端口
  mountpoint: "" # NTRIP挂载点
  username: "" # NTRIP用户名
  password: "" # NTRIP密码

# --- 数据保留策略 ---
retention:
  telemetry_hours: 2 # 遥测数据保留时长(小时)
  operation_days: 3 # 操作记录保留时长(天)
  alarm_days: 1 # 告警记录保留时长(天)
  media_uploaded_days: 7 # 已上传媒体保留时长(天)
  cleanup_interval_hours: 1 # 清理间隔(小时)
  vacuum_interval_hours: 24 # 数据库压缩间隔(小时)
  max_db_size_mb: 50 # 最大数据库大小(MB)

# --- 本地历史日志 ---
local_history:
  enabled: true # 是否保存本地历史日志
  dir: "logs/history" # 本地历史日志根目录
  flight_telemetry_days: 7 # 飞机原始飞行历史遥测保留天数
  device_state_days: 7 # 设备状态变更历史保留天数

# --- 远程调试 ---
debug:
  enabled: true
  websocket_port: 7681
  auth_token: "" # 空表示不校验
  session_timeout: 1800 # 30分钟
