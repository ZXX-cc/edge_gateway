    speaker:
      name: "喊话器"
      enabled: true
      direct_to_gateway: true
      channels:
        control_audio:
          direction: "gateway_to_payload"
          transport: "vendor_protocol" # vendor_protocol/tcp/serial；配置 tcp.host + tcp_port 后自动走 TCP
          adapter: "jz_speaker" # 极至喊话器协议 2.4；未配置串口/TCP 时仅模拟回包，不访问硬件
          endpoint: "" # 可选：tcp://192.168.10.71:71
          timing: "on_demand"
          tcp:
            host: "192.168.1.71" # 厂商助手默认：1号 192.168.10.71:71；当前现场喊话器为 192.168.1.71:8600
            tcp_port: 8600
            timeout_seconds: 1.0
            write_timeout_seconds: 1.0
            wait_reply: false
            auto_connect: false
            text_encoding: "utf-8"
          serial:
            port: "" # Linux 示例：/dev/ttyUSB0 或 /dev/ttyAMA0；Windows 示例：COM3
            baudrate: 115200
            timeout_seconds: 1.0
            write_timeout_seconds: 1.0
            wait_reply: false # 设 true 会等待设备 5B 5B 77 回包；无回包会按失败处理
            auto_connect: false
            text_encoding: "utf-8"
          fixed_text_loop:
            text: "固定文本循环播放测试" # 固定文本循环播放内容
            interval_seconds: 5 # 每隔多少秒重复下发一次 TTS
            volume: 40
            speed: 50
            voice_type: "female"
          audio_file_play:
            filename: "01.wav" # 喊话指令默认播放的文件名；可先用 list-files 查询设备内文件
            play_mode: 0 # 0=单次播放，1=循环播放
            volume: 40
            duration_seconds: 5 # 直连测试时自动停止等待秒数；0=不自动停止
          realtime_voice:
            input_type: "dshow" # Windows 麦克风采集使用 dshow
            audio_device: "阵列麦克风 (AMD Audio Device)"
            sample_rate: 16000
            channels: 1
            bitrate: "32k"
            frame_duration_ms: 20
            volume: 40

# --- RTK / RTCM 差分注入配置 ---
rtk:
  enabled: true # 与 RTKF9P/config.yaml 参考项目保持一致，启用 F9P 基准站 RTCM 数据源
  active_source: "F9P" # 固定使用 F9P；auto=按 priority 自动选源，也可填其它源名
  min_inject_interval: 0.0 # RTCM 注入最小间隔秒数，0 表示不降频；对应参考项目不降频转发
  sources:
    F9P:
      type: "tcp" # ZED-F9P 串口转 TCP 输出 RTCM3，对应参考项目 base_station
      host: "192.168.1.21" # 与 RTKF9P/config.yaml base_station.host 相同
      port: 8600 # 与 RTKF9P/config.yaml base_station.port 相同
      priority: 10
      connect_timeout: 10.0 # 与 RTKF9P/config.yaml base_station.connect_timeout 相同
  auto_switch:
    enabled: false # 参考项目仅配置单 F9P 源，因此默认关闭距离/返航自动切源
    takeoff_landing_rtk: ["F9P"]
    cruise_rtk: ["F9P"]

# --- 数据保留策略 ---
retention:
  telemetry_hours: 2 # 遥测数据保留时长(小时)
  operation_days: 3 # 操作记录保留时长(天)
  alarm_days: 1 # 告警记录保留时长(天)
  media_uploaded_days: 7 # 已上传媒体保留时长(天)
  cleanup_interval_hours: 1 # 清理间隔(小时)
  vacuum_interval_hours: 24 # 数据库压缩间隔(小时)
  max_db_size_mb: 50 # 最大数据库大小(MB)
  disk_cleanup:
    enabled: true # 磁盘达到高水位时，保留管理器会提前触发日志和本地历史兜底清理
    high_watermark_percent: 80 # 磁盘使用率达到 80% 触发提前清理
    target_percent: 75 # 目标清理到 75% 以下
    cooldown_seconds: 300 # 两次磁盘兜底清理之间的最小间隔，避免频繁扫描

# --- 本地历史日志 ---
local_history:
  enabled: true # 是否保存本地历史日志
  dir: "logs/history" # 本地历史日志根目录
  flight_telemetry_days: 7 # 飞机原始飞行历史遥测保留天数
  device_state_days: 7 # 设备状态变更历史保留天数
  flight_telemetry_granularity: "hour" # 飞机原始飞行遥测按小时拆文件：logs/history/flight_telemetry/YYYY-MM/YYYY-MM-DD_HH.jsonl
  device_state_granularity: "day" # 设备状态按天拆文件：logs/history/device_state/YYYY-MM/YYYY-MM-DD.jsonl
  compress_after_days: 1 # 超过 1 天的历史 JSONL 自动 gzip 压缩
  disk_cleanup_enabled: true # 磁盘高水位时允许按旧到新删除本地历史小文件

# --- 本地可校验安全策略 ---
security:
  mqtt:
    downstream_auth_enabled: false # 生产环境必须开启云端下行 HMAC 签名校验
    reply_auth_enabled: false # 云端 requests_reply/status_reply 签名校验，需平台约定后开启
    sign_algorithm: "hmac-sha256"
    sign_secret: "" # 生产环境至少 16 字符，平台和网关保持一致
    timestamp_window_seconds: 300 # MQTT timestamp 允许时间窗
    nonce_ttl_seconds: 300 # nonce 防重放缓存时长
    require_nonce: true
  drc:
    heartbeat_timestamp_window_seconds: 30 # DRC 心跳 timestamp 允许时间窗
    require_heartbeat_seq_increasing: true # DRC 心跳 seq 必须递增
  mission:
    schedule_clock_skew_seconds: 60 # 航线定时/条件任务允许的时钟误差

# --- 远程调试 ---
debug:
  enabled: true
  websocket_port: 7681
  auth_token: "" # 空表示不校验
  session_timeout: 1800 # 30分钟
