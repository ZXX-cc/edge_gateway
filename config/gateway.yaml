      channels:
        control:
          direction: "bidirectional"
          transport: "viewlink_tcp"
          adapter: "viewlink"
          host: "192.168.1.119"
          port: 2000
          connect_timeout: 5
          sdk_dir: "./" # ViewLink SDK 目录；"./" 表示项目根目录，需放置 ViewLink.dll 及依赖 DLL
          register_dev_status_callback: false # 默认跳过设备状态回调，避免 Windows ViewLink SDK 回调访问违规影响控制链路
        video:
          direction: "payload_to_gateway"
          transport: "rtsp"
