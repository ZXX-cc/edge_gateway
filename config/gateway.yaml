    spectral_camera:
      name: "多光谱/高光谱"
      enabled: true
      direct_to_gateway: true
      host: "192.168.1.115"
      model_key: "yusense-ycam"
      cloud_api:
        type: 52
        subtype: 0
        gimbal_index: 2
        video_index: "spectral-0"
        video_type: "normal"
        source_key: "spectral_camera"
        switchable_video_types: ["normal", "multispectral"]
      channels:
        control:
          direction: "bidirectional"
