# Local-only configuration for real ViewLink gimbal chain tests.
gateway:
  sn: "EDGEGW001"
  name: "EdgeGateway-Gimbal-Test"
  product_type: "edge-gateway"

runtime:
  mode: "test"

database:
  backend: "sqlite"

nanomq:
  enabled: true
  host: "127.0.0.1"
  port: 1883
  client_id: "edge_gateway_EDGEGW001_local_payload_test"
  ws_port: 8083
  max_clients: 100
  keepalive: 60
  username: ""
  password: ""
  topic_prefix: "thing/product"
  ssl:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

mavlink:
  enabled: false
  connection:
    type: "tcp"
    host: "127.0.0.1"
    port: 8600
  system_id: 255
  component_id: 190

nest_mavlink:
  enabled: false
  connection:
    type: "tcp"
    host: "127.0.0.1"
    port: 8600
  system_id: 255
  component_id: 1

device:
  firmware_version: "1.0.0"
  storage_capacity: 64000
  auto_bind_on_startup: true
  auto_bind_workspace_id: "local_test_workspace"
  auto_bind_workspace_name: "本地测试工作空间"
  topology:
    device_secret: ""
    nonce: ""

mission:
  completion:
    enabled: false

media:
  storage_path: "./data/media"
  auto_upload: true
  upload_quality: "original"
  video_sources:
    normal: "rtsp://192.168.1.119:554/main"
    zoom: "rtsp://192.168.1.119:554/main"
    gimbal: "rtsp://192.168.1.119:554/main"
  remote_media:
    enabled: true
    base_url: "http://192.168.1.119:8554/download/"
    max_depth: 4
    timeout_seconds: 5
    extensions: ["jpg", "jpeg", "png", "dng", "mp4", "mov", "avi", "mkv"]
  oss:
    provider: "minio"
    endpoint: ""
    bucket: ""
    region: ""
    object_key_prefix: ""
    credentials:
      access_key_id: ""
      access_key_secret: ""
      expire: 0
      security_token: ""

livestream:
  protocols: ["webrtc", "rtmp"]
  default_quality: "1080p"
  default_bitrate: 4000
  default_framerate: 30

logging:
  level: "INFO" # DEBUG/INFO/WARNING/ERROR
  dir: "./logs" # 日志根目录；Windows/Ubuntu 均按 pathlib 处理路径
  filename_prefix: "edge_gateway_gimbal_test" # 网关总日志：logs/YYYY-MM/edge_gateway_gimbal_test_YYYY-MM-DD.log
  max_file_mb: 100 # 单个日志文件超过该大小会自动切分为 _001/_002
  console: true # 同时输出到终端
  capture_print: true # 捕获旧模块 print/stdout/stderr 到日志文件
  daily_files: true # 每日独立日志文件
  monthly_dirs: true # 每月独立日志目录
  important:
    enabled: true # WARNING/ERROR/CRITICAL 会额外写入重要日志，默认保留 30 天
    dir: "important" # 重要日志目录：logs/important/YYYY-MM/important_YYYY-MM-DD.log
    filename_prefix: "important"
    level: "WARNING"
  retention:
    enabled: true # 是否启用运行日志自动清理和压缩
    normal_days: 7 # 普通运行日志保留 7 天
    important_days: 30 # 报错/告警等重要日志保留 30 天
    debug_days: 3 # 调试/原始链路日志保留 3 天
    compress_after_days: 1 # 超过 1 天的旧日志自动 gzip 压缩
    max_file_mb: 100 # 分类日志未单独配置时沿用该切分大小
    disk_cleanup_enabled: true # 磁盘高水位时允许提前清理日志
    disk_high_watermark_percent: 80 # 磁盘使用率达到 80% 触发兜底清理
    disk_target_percent: 75 # 兜底清理目标水位
    debug_categories: ["mqtt_trace", "gateway_traffic", "nest_raw", "drone_report", "mavlink_raw"]
    important_categories: ["alarm", "important"]
  categories:
    gateway:
      enabled: true
      dir: "gateway"
      filename_prefix: "gateway"
    mqtt:
      enabled: true
      dir: "mqtt"
      filename_prefix: "mqtt"
    payload:
      enabled: true
      dir: "payload"
      filename_prefix: "payload"

request_trace:
  enabled: true
  dir: "./logs/request_trace"
  filename_prefix: "request_trace_gimbal_test"
  max_memory: 1000
  max_queue: 2000
  payload_max_chars: 3000

payload:
  control_path: "direct_gateway"
  flight_controller_fallback_enabled: false
  frame_zoom_centering_enabled: true
  frame_zoom_centering_mode: "track"
  frame_zoom_centering_fallback_mode: "zoom_only"
  frame_zoom_allow_zoom_without_center: true
  frame_zoom_track_settle_seconds: 0.25
  frame_zoom_centering_duration: 0.08
  frame_zoom_centering_speed_scale: 1200
  frame_zoom_centering_max_speed: 400
  frame_zoom_max_ratio: 30.0
  devices:
    gimbal:
      name: "吊舱"
      enabled: true
      auto_connect: true
      direct_to_gateway: true
      channels:
        control:
          direction: "bidirectional"
          transport: "viewlink_tcp"
          adapter: "viewlink"
          host: "192.168.1.119"
          port: 2000
          connect_timeout: 5
          sdk_dir: "./"
          register_dev_status_callback: false
        video:
          direction: "payload_to_gateway"
          transport: "rtsp"
          endpoint: "rtsp://192.168.1.119:554/main"
          timing: "realtime"

rtk:
  enabled: false

retention:
  telemetry_hours: 2 # 遥测数据保留时长(小时)
  operation_days: 3 # 操作记录保留时长(天)
  alarm_days: 1 # 告警记录保留时长(天)
  media_uploaded_days: 7 # 已上传媒体保留时长(天)
  cleanup_interval_hours: 1 # 清理间隔(小时)
  vacuum_interval_hours: 24 # 数据库压缩间隔(小时)
  max_db_size_mb: 50 # 最大数据库大小(MB)
  disk_cleanup:
    enabled: true # 磁盘达到高水位时，提前触发日志和本地历史兜底清理
    high_watermark_percent: 80 # 磁盘使用率达到 80% 触发提前清理
    target_percent: 75 # 目标清理到 75% 以下
    cooldown_seconds: 300 # 两次磁盘兜底清理之间的最小间隔

local_history:
  enabled: true # 是否保存本地历史日志
  dir: "logs/history" # 本地历史日志根目录
  flight_telemetry_days: 7 # 飞机原始飞行历史遥测保留天数
  device_state_days: 7 # 设备状态变更历史保留天数
  flight_telemetry_granularity: "hour" # 飞机原始飞行遥测按小时拆文件
  device_state_granularity: "day" # 设备状态按天拆文件
  compress_after_days: 1 # 超过 1 天的历史 JSONL 自动 gzip 压缩
  disk_cleanup_enabled: true # 磁盘高水位时允许按旧到新删除本地历史小文件

security:
  mqtt:
    downstream_auth_enabled: false
    reply_auth_enabled: false
    sign_algorithm: "hmac-sha256"
    sign_secret: ""
    timestamp_window_seconds: 300
    nonce_ttl_seconds: 300
    require_nonce: true
  drc:
    heartbeat_timestamp_window_seconds: 30
    require_heartbeat_seq_increasing: true
  mission:
    schedule_clock_skew_seconds: 60

debug:
  enabled: false
  websocket_port: 7681
  auth_token: ""
  session_timeout: 1800
